name: Release

# Manual release: publish to crates.io, then tag.
#
# Bump the version in Cargo.toml, Cargo.lock, and both plugin.json files
# (.claude-plugin and plugins/codex/.codex-plugin) in a normal commit to main
# FIRST, then wait for CI + Version Check to go green on that commit, then run
# this workflow and type that same version. Pipeline:
#
#   prereqs (CI + Version Check on SHA must be green) -> verify -> test -> publish -> tag
#
# If any guard or the publish fails, nothing is tagged. Fix the cause and
# re-run -- no retagging.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must already match Cargo.toml/Cargo.lock/plugin.json on main)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  prereqs:
    name: Require CI + Version Check green on ${{ github.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify sibling workflows succeeded on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          fail=0
          for wf in "ci.yml" "version-check.yml"; do
            run=$(gh run list --repo "$REPO" --workflow "$wf" --commit "$SHA" --limit 1 --json status,conclusion,databaseId --jq '.[0] // empty')
            if [ -z "$run" ]; then
              echo "❌ No $wf run found on $SHA -- wait for it to start (or check it ran)."
              fail=1
              continue
            fi
            s=$(echo "$run" | jq -r .status)
            c=$(echo "$run" | jq -r .conclusion)
            id=$(echo "$run" | jq -r .databaseId)
            if [ "$s" != "completed" ]; then
              echo "❌ $wf run $id on $SHA is $s -- wait for it to finish, then re-dispatch."
              fail=1
              continue
            fi
            if [ "$c" != "success" ]; then
              echo "❌ $wf run $id on $SHA concluded $c -- fix it on main, then re-dispatch."
              fail=1
              continue
            fi
            echo "✅ $wf run $id on $SHA: success"
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

  release:
    name: Release v${{ inputs.version }}
    needs: prereqs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # --- Guards: back off here, before anything irreversible ---

      - name: Ensure running on main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "❌ Release must be run from main (got ${{ github.ref }})"
            exit 1
          fi
          echo "✅ Running on main"

      - name: Verify version files match input
        run: |
          INPUT="${{ inputs.version }}"
          CARGO=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          PLUGIN=$(grep '"version":' .claude-plugin/plugin.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          CODEX_PLUGIN=$(grep '"version":' plugins/codex/.codex-plugin/plugin.json | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          LOCK=$(grep -A1 '^name = "sidekick"' Cargo.lock | grep '^version' | sed 's/version = "\(.*\)"/\1/')

          fail=0
          for pair in "Cargo.toml:$CARGO" ".claude-plugin/plugin.json:$PLUGIN" "plugins/codex/.codex-plugin/plugin.json:$CODEX_PLUGIN" "Cargo.lock:$LOCK"; do
            name=${pair%%:*}; val=${pair#*:}
            if [ "$val" != "$INPUT" ]; then
              echo "❌ $name version ($val) does not match input ($INPUT)"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Bump all version files and commit to main before releasing."
            exit 1
          fi
          echo "✅ All version files match $INPUT"

      - name: Ensure tag does not already exist
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "❌ Tag v${{ inputs.version }} already exists"
            exit 1
          fi
          echo "✅ Tag v${{ inputs.version }} is free"

      - name: Run tests
        run: cargo test --locked --verbose

      - name: Dry-run publish
        run: cargo publish --locked --dry-run

      # --- Irreversible steps ---

      - name: Publish to crates.io
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ inputs.version }}" -m "Release v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"
          echo "✅ Published and tagged v${{ inputs.version }}"
